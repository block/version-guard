# Example: EKS (Declarative Lifecycle Schema)
# This is an example of a resource using NON-STANDARD endoflife.date schema
# EKS uses cycle.eol to mean "end of standard support" NOT "true EOL"
# Lifecycle semantics are declared in YAML; no custom Go adapter is required.
#
# IMPORTANT: The resource 'id' is used to look up the Wiz report ID
# in the WIZ_REPORT_IDS JSON map environment variable.
#
# Example: WIZ_REPORT_IDS='{"eks":"report-id-here"}'

  - id: eks
    type: eks
    cloud_provider: aws
    inventory:
      source: wiz
      native_type_pattern: "cluster"
      # required_mappings: every entry MUST be present and non-empty.
      # EKS doesn't include an engine column — engine is implicitly "eks".
      required_mappings:
        # For EKS, Wiz's "externalId" column is an internal hash. Map
        # resource_id to "providerUniqueId" so Resource.ID is the cluster ARN.
        resource_id: "providerUniqueId"
        version: "versionDetails.version"
      field_mappings:
        name: "name"
        account_id: "cloudAccount.externalId"
        region: "region"
        tags: "tags"
    transforms:
      # EKS reports have no engine column at all; default the empty
      # value to the engine name endoflife.date keys cycles by.
      # See TRANSFORMS.md for the full operation reference.
      engine:
        default_if_empty: "eks"
    eol:
      provider: endoflife-date
      product: amazon-eks
      schema: declarative
      lifecycle:
        deprecation_date:
          field: eol
        extended_support_end:
          field: extendedSupport
          bool_true_fallback: eol
        deprecated_window: extended_support
        past_extended_support: unsupported
